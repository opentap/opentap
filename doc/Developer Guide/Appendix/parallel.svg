<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Deferred processing: measurements run back to back on thread 1 while each
     result is processed on a separate thread. Drawn to the same time scale and
     canvas width as sequential.svg, so the shorter total time is comparable.
     Measure bars use the brand red from doc/.vitepress/theme/custom.css,
     #e61e33 (vp-c-brand-1). Each processing element gets its own shade of a
     softened neutral in the same family as #333433 (vp-c-brand-2), matching the
     shade used for the same process in sequential.svg. White label text stays
     at 6.3:1 contrast or better. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="192" viewBox="0 0 1000 192" version="1.1">
  <style>
    .bg    { fill: #ffffff; }
    .lbl   { font: 600 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #333433; }
    .bar   { font: 600 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .cap   { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6e75; }
    .meas  { fill: #e61e33; }
    .proc1 { fill: #4a4f57; }
    .proc2 { fill: #525862; }
    .proc3 { fill: #5b6068; }
    .dim   { stroke: #b9bdc4; stroke-width: 1; }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="192"/>

  <text class="lbl" x="74" y="34.5"  text-anchor="end">Thread 1:</text>
  <text class="lbl" x="74" y="68.5"  text-anchor="end">Thread 2:</text>
  <text class="lbl" x="74" y="102.5" text-anchor="end">Thread 3:</text>
  <text class="lbl" x="74" y="136.5" text-anchor="end">Thread 4:</text>

  <rect class="meas" x="84"  y="16" width="90" height="28" rx="3"/>
  <text class="bar"  x="129" y="34.5" text-anchor="middle">Measure 1</text>

  <rect class="meas" x="174" y="16" width="90" height="28" rx="3"/>
  <text class="bar"  x="219" y="34.5" text-anchor="middle">Measure 2</text>

  <rect class="meas" x="264" y="16" width="90" height="28" rx="3"/>
  <text class="bar"  x="309" y="34.5" text-anchor="middle">Measure 3</text>

  <rect class="proc1" x="174" y="50" width="210" height="28" rx="3"/>
  <text class="bar"  x="279" y="68.5" text-anchor="middle">Process 1</text>

  <rect class="proc2" x="264" y="84" width="210" height="28" rx="3"/>
  <text class="bar"  x="369" y="102.5" text-anchor="middle">Process 2</text>

  <rect class="proc3" x="354" y="118" width="210" height="28" rx="3"/>
  <text class="bar"  x="459" y="136.5" text-anchor="middle">Process 3</text>

  <line class="dim" x1="84"  y1="164" x2="564" y2="164"/>
  <line class="dim" x1="84"  y1="159" x2="84"  y2="169"/>
  <line class="dim" x1="564" y1="159" x2="564" y2="169"/>
  <text class="cap" x="324" y="182" text-anchor="middle">total time</text>
</svg>
