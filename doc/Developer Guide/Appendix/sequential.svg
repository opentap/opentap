<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sequential processing: each measurement is followed by its processing on
     the same thread. Measure bars use the brand red from
     doc/.vitepress/theme/custom.css, #e61e33 (vp-c-brand-1). Each processing
     element gets its own shade of a softened neutral in the same family as
     #333433 (vp-c-brand-2), so the same process keeps the same colour in
     parallel.svg. White label text stays at 6.3:1 contrast or better. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="90" viewBox="0 0 1000 90" version="1.1">
  <style>
    .bg    { fill: #ffffff; }
    .lbl   { font: 600 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #333433; }
    .bar   { font: 600 13px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; }
    .cap   { font: 400 12px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #6b6e75; }
    .meas  { fill: #e61e33; }
    .proc1 { fill: #4a4f57; }
    .proc2 { fill: #525862; }
    .proc3 { fill: #5b6068; }
    .dim   { stroke: #b9bdc4; stroke-width: 1; }
  </style>

  <rect class="bg" x="0" y="0" width="1000" height="90"/>

  <text class="lbl" x="74" y="34.5" text-anchor="end">Thread 1:</text>

  <rect class="meas" x="84"  y="16" width="90"  height="28" rx="3"/>
  <text class="bar"  x="129" y="34.5" text-anchor="middle">Measure 1</text>

  <rect class="proc1" x="174" y="16" width="210" height="28" rx="3"/>
  <text class="bar"  x="279" y="34.5" text-anchor="middle">Process 1</text>

  <rect class="meas" x="384" y="16" width="90"  height="28" rx="3"/>
  <text class="bar"  x="429" y="34.5" text-anchor="middle">Measure 2</text>

  <rect class="proc2" x="474" y="16" width="210" height="28" rx="3"/>
  <text class="bar"  x="579" y="34.5" text-anchor="middle">Process 2</text>

  <rect class="meas" x="684" y="16" width="90"  height="28" rx="3"/>
  <text class="bar"  x="729" y="34.5" text-anchor="middle">Measure 3</text>

  <rect class="proc3" x="774" y="16" width="210" height="28" rx="3"/>
  <text class="bar"  x="879" y="34.5" text-anchor="middle">Process 3</text>

  <line class="dim" x1="84"  y1="62" x2="984" y2="62"/>
  <line class="dim" x1="84"  y1="57" x2="84"  y2="67"/>
  <line class="dim" x1="984" y1="57" x2="984" y2="67"/>
  <text class="cap" x="534" y="80" text-anchor="middle">total time</text>
</svg>
