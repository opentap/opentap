name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*

env:
  #OPENTAP_COLOR: auto # github messes with the "auto" detection (i.e. it has no effect), and "always" breaks a lot of things
  OPENTAP_ANSI_COLORS: true
  OPENTAP_NO_UPDATE_CHECK: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CONSOLE_ANSI_COLOR: true
  SMARTINSTALLER_IMAGE: ghcr.io/opentap/smartinstaller:3.1.0-rc.3  # smartinstaller/15ae441d61cffb5591bea7f17a1cb93ba0c2709a


jobs:
  GetVersion:
    runs-on:
       group: OpenTAP-SpokeVPC
       labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    outputs:
      ShortVersion: ${{ steps.gitversion.outputs.ShortVersion }}
      LongVersion: ${{ steps.gitversion.outputs.LongVersion }}
      GitVersion: ${{ steps.gitversion.outputs.GitVersion }}
      SmartInstallerVersion: ${{ steps.smartInstallerVersion.outputs.ver }}
    steps:
      # The get-gitversion action installs OpenTAP and fetches with fetch-depth: 0
      - name: GitVersion
        id: gitversion
        uses: opentap/get-gitversion@d1353d4355f2c12e09bb7886ccc9aa7d18243ebc #2.0
      - name: SmartInstallerVersion
        id: smartInstallerVersion
        run: echo "VER=$SMARTINSTALLER_IMAGE" >> $GITHUB_OUTPUT

  Build-Test-Binaries:
    # These binaries are used only by the test jobs below and are never shipped.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Set bootstrap version
        shell: bash
        run: |
          version="$(grep '^version' .gitversion | cut -d= -f2 | xargs)"
          echo "ShortVersion=$version" >> "$GITHUB_ENV"
          echo "GitVersion=$version" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build -c Release
      - name: Upload Windows test binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-x64-test-binaries
          retention-days: 1
          path: bin/Release/*
          if-no-files-found: error

  Test-Engine:
    runs-on: windows-2022
    needs: Build-Test-Binaries
    strategy:
      matrix:
        retries: [ 0, 1 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-x64-test-binaries
          path: bin
      - name: Test Engine
        run: dotnet test bin/OpenTap.UnitTests.dll --logger:"console;verbosity=detailed" --blame-hang-timeout 300s --blame-hang-dump-type full -- RunConfiguration.TreatNoTestsAsError=true
      - name: Upload Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Engine-TestResults-${{ matrix.retries }}
          retention-days: 5
          path: |
            TestResults

  Test-Package:
    runs-on: windows-2022
    needs: Build-Test-Binaries
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-x64-test-binaries
          path: bin/Release
      - name: Test Package
        run: |
          $ErrorActionPreference = "Stop"
          cd bin/Release                                                                       # Timeout: 10 minutes (normally takes 5 minutes to run)
          dotnet test OpenTap.Package.UnitTests.dll --logger:"console;verbosity=detailed" --blame-hang-timeout 300s --blame-hang-dump-type full -- RunConfiguration.TestSessionTimeout=600000 RunConfiguration.TreatNoTestsAsError=true
      - name: Upload Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Package-TestResults
          retention-days: 5
          path: bin/Release/TestResults


  TestWindowsPlan:
    runs-on: windows-2022
    needs: BuildAndPackage
    strategy:
      matrix:
        retries: [ 0, 1 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: sdk-template
      - name: Install Templates
        run: dotnet new install ./sdk-template/*.nupkg
      - name: Build
        run: dotnet build
      - name: Install Debug Package
        working-directory: bin/Debug
        run: ./tap package install -f OpenTap.Debug.TapPackage
      - name: Test
        working-directory: bin/Debug
        run: ./tap.exe run ../../tests/regression.TapPlan --verbose --color
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: regression-files
          path: |
            NewProj*/**

  TestLinuxPlan:
    runs-on: ubuntu-latest
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs:
      - BuildAndPackage
    strategy:
      matrix:
        retries: [ 0, 1 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: sdk-template
      - name: Install Templates
        run: dotnet new --install ./sdk-template/*.nupkg
      - name: Build
        run: dotnet build
      - name: Install Debug Package
        working-directory: bin/Debug
        run: ./tap package install -f OpenTap.Debug.TapPackage
      - run: bin/Debug/tap run tests/regression.TapPlan --verbose --color

  TestMacPlan:
    runs-on: macos-14
    needs: BuildAndPackage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download Template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: sdk-template
      - name: Install Templates
        run: dotnet new --install ./sdk-template/*.nupkg
      - name: Build
        run: dotnet build
      - name: Install Debug Package
        working-directory: bin/Debug
        run: ./tap package install -f OpenTap.Debug.TapPackage
      - run: bin/Debug/tap run tests/regression.TapPlan --verbose --color

  BuildAndPackage:
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    env:
      TAP_SIGN_ADDRESS: ${{ secrets.TAP_SIGN_ADDRESS_INTERNAL }}
      TAP_SIGN_AUTH: ${{ secrets.TAP_SIGN_AUTH }}
      TAP_SIGN_CERT: ${{ github.workspace }}/sign.cer
      SIGN_SERVER_CERT: ${{ secrets.SIGN_SERVER_CERT }}
      KS8500_REPO_TOKEN: ${{ secrets.KS8500_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Write Sign Cert
        if: ${{ env.SIGN_SERVER_CERT != '' }}
        run: printf '%s' "$SIGN_SERVER_CERT" > "$TAP_SIGN_CERT"
      - name: Build
        run: dotnet run CI/build.cs -- --require-devguide

      - name: Upload OpenTAP packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentap-packages
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/OpenTAP.*.TapPackage
          if-no-files-found: error
      - name: Upload SDK package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-package
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/SDK.TapPackage
          if-no-files-found: error
      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/OpenTAP.*.nupkg
          if-no-files-found: error
      - name: Upload template package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-package
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/OpenTap.Templates.*.nupkg
          if-no-files-found: error

  Package-Diff:
    runs-on:
       group: OpenTAP-SpokeVPC
       labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs: BuildAndPackage
    steps:
      - uses: opentap/setup-opentap@d5108b37a770b99e4df3c15273cddfbaf52e6e80 # v1.2.0
        with:
          version: 9.21.1
          packages: 'Package Diff:0.1.0-beta.21'
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentap-packages
          path: .
      - name: Rename Package
        run: mv OpenTAP.*.Linux.x64.TapPackage OpenTAP.TapPackage
      - name: Diff Package
        run: tap package diff OpenTAP.TapPackage -o diff

  Build-Installer-Windows:
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    needs:
      - GetVersion
      - BuildAndPackage
    container:
      image: ${{ needs.GetVersion.outputs.SmartInstallerVersion }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentap-packages
          path: .
      - name: Download SDK package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-package
          path: .
      - run: mv OpenTAP.*.Windows.x64.TapPackage Installer/Assets/OpenTAP.TapPackage
      - run: echo "${{ secrets.SIGN_SERVER_CERT }}" > $GITHUB_WORKSPACE/sign.cer
      - run: mv SDK.TapPackage Installer/Assets/SDK.TapPackage
      - run: tap installer create "opentap.installer.xml" -v --target-os win --arch x64
        working-directory: Installer/Assets
        env:
          TAP_SIGN_ADDRESS: ${{ secrets.TAP_SIGN_ADDRESS_INTERNAL }}
          TAP_SIGN_AUTH: ${{ secrets.TAP_SIGN_AUTH }}
          TAP_SIGN_CERT: ${{ github.workspace }}/sign.cer
      - run: mv Installer/Assets/setup.exe OpenTAP.${{needs.GetVersion.outputs.LongVersion}}.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-windows
          retention-days: 14
          path: OpenTAP.*.exe

  Publish-Installer-Windows:
    if: contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: packages.opentap.io
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs:
      - Build-Installer-Windows 
      - GetVersion
    steps: 
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-windows
      - name: Rename Artifact 
        run: mv OpenTAP.*.exe OpenTAP.exe
      - name: Upload Installer 
        env: 
          INSTALLER_PUBLISH_KEY: ${{ secrets.INSTALLER_PUBLISH_KEY }}
        run: | 
          curl -i -X POST 'http://packages.opentap.io/4.0/Objects/www/' \
               -H 'Metadata-Version: "${{ needs.GetVersion.outputs.LongVersion }}"' \
               -H 'Metadata-OS: "Windows"' \
               -H "Authorization: Token: $INSTALLER_PUBLISH_KEY" \
               --form 'file=@"OpenTAP.exe"'
      - name: Upload Installer to Archive
        run: curl --user ${{ secrets.INSTALLER_PUBLISH_KEY_ARCHIVE }} --data-binary @"OpenTAP.exe" -X PUT "https://artifactory.it.keysight.com/artifactory/generic-local-automation/OpenTAP/WindowsX32/OpenTAP.${{ needs.GetVersion.outputs.LongVersion }}.exe"

  Build-Installer-Linux:
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    needs:
      - GetVersion
      - BuildAndPackage
    container:
      image: ${{ needs.GetVersion.outputs.SmartInstallerVersion }}      
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentap-packages
          path: .
      - name: Download SDK package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-package
          path: .
      - run: mv OpenTAP.*.Linux.x64.TapPackage Installer/Assets/OpenTAP.TapPackage
        name: Rename package
      - run: mv SDK.TapPackage Installer/Assets/SDK.TapPackage
      - run: tap installer create "opentap.installer.linux.xml" -v --target-os linux --arch x64
        working-directory: Installer/Assets
        name: Build installer
      - run: mv Installer/Assets/Installer Installer/Assets/OpenTAP
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-linux
          retention-days: 14
          path: Installer/Assets/OpenTAP

  Publish-Installer-Linux:
    if: contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: packages.opentap.io
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs:
      - Build-Installer-Linux
      - GetVersion
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-linux
      - name: Upload Installer 
        env: 
          INSTALLER_PUBLISH_KEY: ${{ secrets.INSTALLER_PUBLISH_KEY }}
        run: | 
          curl -i -X POST 'http://packages.opentap.io/4.0/Objects/www/' \
               -H 'Metadata-Version: "${{ needs.GetVersion.outputs.LongVersion }}"' \
               -H 'Metadata-OS: "Linux"' \
               -H "Authorization: Token: $INSTALLER_PUBLISH_KEY" \
               --form 'file=@"OpenTAP"'
      - name: Upload Installer to Archive
        run: curl --user ${{ secrets.INSTALLER_PUBLISH_KEY_ARCHIVE }} --data-binary @"OpenTAP" -X PUT "https://artifactory.it.keysight.com/artifactory/generic-local-automation/OpenTAP/LinuxX64/OpenTAP.${{ needs.GetVersion.outputs.LongVersion }}"

  Docker-Linux:
    if: github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-docker:latest
    environment: sign
    strategy:
      matrix:
        include:
          - target: production
            tag-suffix: "-slim"
          - target: development
            tag-suffix: ""
          - target: production-hardened
            tag-suffix: "-slim-hardened"
    needs:
      - BuildAndPackage
      - GetVersion
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentap-packages
          path: .
      - name: Prepare
        run: |
          mv OpenTAP.*.Linux.x64.TapPackage docker/Linux/OpenTAP.Linux.TapPackage
          echo "TAG_NAME=alpha" >> $GITHUB_ENV
      - name: Set tag (beta)
        if: github.ref == 'refs/heads/main'
        run: echo "TAG_NAME=beta" >> $GITHUB_ENV
      - name: Set tag (rc)
        if: contains(github.ref, 'refs/heads/release')
        run: echo "TAG_NAME=rc" >> $GITHUB_ENV
      - name: Set tag (release)
        if: contains(github.ref, 'refs/tags/v')
        run: echo "TAG_NAME=${{needs.GetVersion.outputs.ShortVersion}}" >> $GITHUB_ENV
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/Linux
          target: ${{ matrix.target }}
          push: true
          tags: opentapio/opentap:${{env.TAG_NAME}}${{ matrix.tag-suffix }}


  ###############
  ### Publish ###
  ###############
  Publish-NuGet:
    if: github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')
    environment: nuget.org
    runs-on:
      group: OpenTAP-SpokeVPC
      labels: [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs:
      - BuildAndPackage
    steps:
      - name: Download nuget package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: .
      - name: Publish NuGet package
        run: dotnet nuget push OpenTAP.*.nupkg --api-key "${{ secrets.NUGET_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  Publish-Templates:
    if: github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')
    environment: nuget.org
    runs-on:
      group: OpenTAP-SpokeVPC
      labels: [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs:
      - BuildAndPackage
    steps:
      - name: Download Template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: .
      - name: Upload Templates
        run: dotnet nuget push OpenTAP.Templates*.nupkg -k ${{ secrets.NUGET_KEY }} -s https://api.nuget.org/v3/index.json # --skip-duplicate --no-symbols

  Publish-TapPackages:
    if: github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')
    environment: packages.opentap.io
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs:
      - BuildAndPackage
    steps:
      - name: Download OpenTAP packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentap-packages
          path: ./publish/
      - name: Setup OpenTAP
        uses: opentap/setup-opentap@2504dd5da8f98ec00722ffa5245ed2db838517d0 # main
        with:
          version: 9.23.0
          packages: 'Repository Client:1.0.3-beta.9+15a03b2b'
      - name: Publish Packages
        run: tap repo upload --repository https://packages.opentap.io --token ${{ secrets.PUBLIC_REPO_TOKEN }} ./publish/*.TapPackage --parallel --skip-existing

  Build-SDK-MacOS:
    runs-on: macos-latest
    needs:
      - BuildAndPackage
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download SDK package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-package
          path: ./sdk-package
      - name: Unzip SDK package
        run: unzip ./sdk-package/SDK.TapPackage
      - name: Download nuget package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: ./Packages/SDK/Examples/nuget-package
      - name: Create Local Nuget Package Source
        run: dotnet nuget add source $(pwd)/nuget-package --name local-nuget
        working-directory: ./Packages/SDK/Examples
