name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - v*

env:
  #OPENTAP_COLOR: auto # github messes with the "auto" detection (i.e. it has no effect), and "always" breaks a lot of things
  OPENTAP_ANSI_COLORS: true
  OPENTAP_NO_UPDATE_CHECK: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CONSOLE_ANSI_COLOR: true


jobs:
  Build-Test-Binaries:
    # These binaries are used only by the test jobs below and are never shipped.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Set bootstrap version
        shell: bash
        run: |
          version="$(grep '^version' .gitversion | cut -d= -f2 | xargs)"
          echo "ShortVersion=$version" >> "$GITHUB_ENV"
          echo "GitVersion=$version" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build -c Release
      - name: Upload Windows test binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-x64-test-binaries
          retention-days: 1
          path: bin/Release/*
          if-no-files-found: error

  TestEngine:
    runs-on: windows-2022
    needs: Build-Test-Binaries
    strategy:
      matrix:
        retries: [ 0, 1 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-x64-test-binaries
          path: bin
      - name: Test Engine
        run: dotnet test bin/OpenTap.UnitTests.dll --logger:"console;verbosity=detailed" --blame-hang-timeout 300s --blame-hang-dump-type full -- RunConfiguration.TreatNoTestsAsError=true
      - name: Upload Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Engine-TestResults-${{ matrix.retries }}
          retention-days: 5
          path: |
            TestResults

  TestPackage:
    runs-on: windows-2022
    needs: Build-Test-Binaries
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: win-x64-test-binaries
          path: bin/Release
      - name: Test Package
        run: |
          $ErrorActionPreference = "Stop"
          cd bin/Release                                                                       # Timeout: 10 minutes (normally takes 5 minutes to run)
          dotnet test OpenTap.Package.UnitTests.dll --logger:"console;verbosity=detailed" --blame-hang-timeout 300s --blame-hang-dump-type full -- RunConfiguration.TestSessionTimeout=600000 RunConfiguration.TreatNoTestsAsError=true
      - name: Upload Test Results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Package-TestResults
          retention-days: 5
          path: bin/Release/TestResults


  TestWindowsPlan:
    runs-on: windows-2022
    needs: BuildAndPackage
    strategy:
      matrix:
        retries: [ 0, 1 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: sdk-template
      - name: Install Templates
        run: dotnet new install ./sdk-template/*.nupkg
      - name: Build
        run: dotnet build
      - name: Install Debug Package
        working-directory: bin/Debug
        run: ./tap package install -f OpenTap.Debug.TapPackage
      - name: Test
        working-directory: bin/Debug
        run: ./tap.exe run ../../tests/regression.TapPlan --verbose --color
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: regression-files
          path: |
            NewProj*/**

  TestLinuxPlan:
    runs-on: ubuntu-latest
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs:
      - BuildAndPackage
    strategy:
      matrix:
        retries: [ 0, 1 ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download Template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: sdk-template
      - name: Install Templates
        run: dotnet new --install ./sdk-template/*.nupkg
      - name: Build
        run: dotnet build
      - name: Install Debug Package
        working-directory: bin/Debug
        run: ./tap package install -f OpenTap.Debug.TapPackage
      - run: bin/Debug/tap run tests/regression.TapPlan --verbose --color

  TestMacPlan:
    runs-on: macos-26
    needs: BuildAndPackage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download Template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: sdk-template
      - name: Install Templates
        run: dotnet new --install ./sdk-template/*.nupkg
      - name: Build
        run: dotnet build
      - name: Install Debug Package
        working-directory: bin/Debug
        run: ./tap package install -f OpenTap.Debug.TapPackage
      - run: bin/Debug/tap run tests/regression.TapPlan --verbose --color

  BuildAndPackage:
    outputs:
      ShortVersion: ${{ steps.build.outputs.ShortVersion }}
      LongVersion: ${{ steps.build.outputs.LongVersion }}
      GitVersion: ${{ steps.build.outputs.GitVersion }}
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    env:
      TAP_SIGN_ADDRESS: ${{ secrets.TAP_SIGN_ADDRESS_INTERNAL }}
      TAP_SIGN_AUTH: ${{ secrets.TAP_SIGN_AUTH }}
      TAP_SIGN_CERT: ${{ github.workspace }}/sign.cer
      SIGN_SERVER_CERT: ${{ secrets.SIGN_SERVER_CERT }}
      KS8500_REPO_TOKEN: ${{ secrets.KS8500_REPO_TOKEN }}
      PUBLISH_ARTIFACTS: ${{ github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v') }}
      PUBLIC_REPO_TOKEN: ${{ (github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')) && secrets.PUBLIC_REPO_TOKEN || '' }}
      INSTALLER_PUBLISH_KEY: ${{ (github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')) && secrets.INSTALLER_PUBLISH_KEY || '' }}
      INSTALLER_PUBLISH_KEY_ARCHIVE: ${{ (github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')) && secrets.INSTALLER_PUBLISH_KEY_ARCHIVE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Write Sign Cert
        if: ${{ env.SIGN_SERVER_CERT != '' }}
        run: printf '%s' "$SIGN_SERVER_CERT" > "$TAP_SIGN_CERT"
      - name: Build
        id: build
        shell: bash
        run: |
          args=()
          if [[ "$PUBLISH_ARTIFACTS" == "true" ]]; then
            args+=(--publish-packages --publish-installers)
          fi
          ./CI/build.sh "${args[@]}"
      - name: Upload OpenTAP packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opentap-packages
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/OpenTAP.*.TapPackage
          if-no-files-found: error
      - name: Upload SDK package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-package
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/SDK.TapPackage
          if-no-files-found: error
      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/OpenTAP.*.nupkg
          if-no-files-found: error
      - name: Upload template package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-package
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/OpenTap.Templates.*.nupkg
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-windows
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/OpenTAP.*.exe
          if-no-files-found: error
      - name: Upload Linux installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-linux
          compression-level: 0
          retention-days: 14
          path: CI/artifacts/OpenTAP
          if-no-files-found: error

  Package-Diff:
    runs-on:
       group: OpenTAP-SpokeVPC
       labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    needs: BuildAndPackage
    steps:
      - uses: opentap/setup-opentap@d5108b37a770b99e4df3c15273cddfbaf52e6e80 # v1.2.0
        with:
          version: 9.21.1
          packages: 'Package Diff:0.1.0-beta.21'
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentap-packages
          path: .
      - name: Rename Package
        run: mv OpenTAP.*.Linux.x64.TapPackage OpenTAP.TapPackage
      - name: Diff Package
        run: tap package diff OpenTAP.TapPackage -o diff

  Docker-Linux:
    if: github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')
    runs-on:
      group: OpenTAP-SpokeVPC
      labels:  [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-docker:latest
    environment: sign
    strategy:
      matrix:
        include:
          - target: production
            tag-suffix: "-slim"
          - target: development
            tag-suffix: ""
          - target: production-hardened
            tag-suffix: "-slim-hardened"
    needs:
      - BuildAndPackage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opentap-packages
          path: .
      - name: Prepare
        run: |
          mv OpenTAP.*.Linux.x64.TapPackage docker/Linux/OpenTAP.Linux.TapPackage
          echo "TAG_NAME=alpha" >> $GITHUB_ENV
      - name: Set tag (beta)
        if: github.ref == 'refs/heads/main'
        run: echo "TAG_NAME=beta" >> $GITHUB_ENV
      - name: Set tag (rc)
        if: contains(github.ref, 'refs/heads/release')
        run: echo "TAG_NAME=rc" >> $GITHUB_ENV
      - name: Set tag (release)
        if: contains(github.ref, 'refs/tags/v')
        run: echo "TAG_NAME=${{needs.BuildAndPackage.outputs.ShortVersion}}" >> $GITHUB_ENV
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
            username: ${{ secrets.DOCKER_USER }}
            password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/Linux
          target: ${{ matrix.target }}
          push: true
          tags: opentapio/opentap:${{env.TAG_NAME}}${{ matrix.tag-suffix }}


  ###############
  ### Publish ###
  ###############
  Publish-NuGet:
    if: github.ref == 'refs/heads/main' || contains(github.ref, 'refs/heads/release') || contains(github.ref, 'refs/tags/v')
    environment: nuget.org
    runs-on:
      group: OpenTAP-SpokeVPC
      labels: [Linux, X64]
    container: ghcr.io/opentap/oci-images/build-dotnet:v10
    permissions:
      id-token: write # Required for NuGet trusted publishing
    needs:
      - BuildAndPackage
    steps:
      - name: Download nuget package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: .
      - name: Download template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: .
      - name: NuGet login
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet and template packages
        shell: bash
        run: |
          if [[ -z "$NUGET_KEY" ]]; then
            echo "NuGet login did not provide NUGET_KEY" >&2
            exit 1
          fi
          dotnet nuget push OpenTAP.*.nupkg --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push OpenTap.Templates.*.nupkg --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}

  Test-SDK-MacOS:
    runs-on: macos-latest
    needs:
      - BuildAndPackage
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download SDK package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-package
          path: ./sdk-package
      - name: Unzip SDK package
        run: unzip ./sdk-package/SDK.TapPackage
      - name: Download nuget package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: .
      - name: Download template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: ./Packages/SDK/Examples/nuget-package
      - name: Create Local Nuget Package Source
        run: dotnet nuget add source $(pwd)/nuget-package --name local-nuget
        working-directory: ./Packages/SDK/Examples
      - run: dotnet build -c Debug
        working-directory: ./Packages/SDK/Examples
      - run: dotnet build -c Release
        working-directory: ./Packages/SDK/Examples
      - name: verify
        working-directory: ./Packages/SDK/Examples
        run: |
          ./bin/Debug/tap package verify OpenTAP
          ./bin/Release/tap package verify OpenTAP


  Test-SDK-Linux:
    runs-on: ubuntu-latest
    needs:
      - BuildAndPackage
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download SDK package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-package
          path: ./sdk-package
      - name: Unzip SDK package
        run: unzip ./sdk-package/SDK.TapPackage
      - name: Download nuget package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: .
      - name: Download template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: ./Packages/SDK/Examples/nuget-package
      - name: Create Local Nuget Package Source
        run: dotnet nuget add source $(pwd)/nuget-package --name local-nuget
        working-directory: ./Packages/SDK/Examples
      - run: dotnet build -c Debug
        working-directory: ./Packages/SDK/Examples
      - run: dotnet build -c Release
        working-directory: ./Packages/SDK/Examples
      - name: verify
        working-directory: ./Packages/SDK/Examples
        run: |
          ./bin/Debug/tap package verify OpenTAP
          ./bin/Release/tap package verify OpenTAP

  Test-SDK-Windows:
    runs-on: windows-2022
    needs:
      - BuildAndPackage
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Download SDK package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-package
          path: ./sdk-package
      - name: Rename SDK package
        run: mv ./sdk-package/SDK.TapPackage SDK.zip
      - name: Unzip SDK package
        run: unzip SDK.zip
      - name: Download nuget package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-package
          path: .
      - name: Download template package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: template-package
          path: ./Packages/SDK/Examples/nuget-package
      - name: Create Local Nuget Package Source
        run: echo '<configuration><packageSources><add key="local-nuget" value="./nuget-package" /></packageSources></configuration>' > ./Packages/SDK/Examples/Nuget.config
      - run: dotnet build -c Debug
        working-directory: ./Packages/SDK/Examples
      - run: dotnet build -c Release
        working-directory: ./Packages/SDK/Examples
      - name: verify
        working-directory: ./Packages/SDK/Examples
        run: |
          ./bin/Debug/tap package verify OpenTAP
          ./bin/Release/tap package verify OpenTAP
